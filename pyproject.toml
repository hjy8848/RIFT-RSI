[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rift-rsi"
version = "0.1.0"
requires-python = ">=3.10"
description = "Replay-grounded learning value research contracts"
[project.scripts]
rift-verl-round = "rift.verl.cli:main"
rift-evolve = "rift.evolution.cli:main"

[project.optional-dependencies]
usami = ["pydantic>=2.12,<3"]
test = ["pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["src", "third_party/usami"]
testpaths = ["tests"]
