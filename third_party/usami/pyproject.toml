[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usami"
version = "0.2.0"
description = "RIFT-maintained Usami v2 Commerce runtime subset"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jsonschema>=4,<5", "hypothesis>=6,<7"]
service = ["httpx>=0.27,<1", "jsonschema>=4,<5"]

[project.urls]
Repository = "https://github.com/hjy8848/RIFT-RSI"
Upstream = "https://github.com/hjy8848/Usami"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "usami", "usami.service", "usami.world",
    "usami_harness",
    "usami_v2", "usami_v2.commerce", "usami_v2.evaluation",
    "usami_v2.runtime", "usami_v2.scenarios",
    "vast_coevo", "vast_coevo.skills",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
